[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eyesp"
version = "0.1.0"
description = "A tiny ISP in a box: DHCP, DNS, NAT, speed plans, metering and billing on Linux."
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
eyesp = "eyesp.cli:main"

[tool.setuptools]
packages = ["eyesp"]

[tool.setuptools.package-data]
eyesp = ["udhcpc.sh"]
